networks:
  public-net: {}
  app-net: {}

services:
  # --- prod profile ---
  client:
    profiles: ["prod"]
    build:
      context: .
      target: client-production
    environment:
      PORT: 3000
    restart: unless-stopped
    networks: [public-net]

  dashboard:
    profiles: ["prod"]
    build:
      context: .
      target: dashboard-production
    environment:
      PORT: 3001
    restart: unless-stopped
    networks: [app-net]

  server:
    profiles: ["prod"]
    build:
      context: .
      target: server-production
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
    restart: unless-stopped
    networks: [app-net]

  nginx-prod:
    profiles: ["prod"]
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - dashboard
      - server
    ports:
      - "80:80"
    networks: [public-net, app-net]

  # --- dev profile ---
  client-dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
    command: npx turbo run dev --filter=@permello/client
    volumes:
      - .:/monorepo
      - /monorepo/node_modules
    networks: [public-net]

  dashboard-dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
    command: npx turbo run dev --filter=@permello/dashboard
    volumes:
      - .:/monorepo
      - /monorepo/node_modules
    networks: [app-net]

  server-dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
    command: npx turbo run dev --filter=@permello/server
    volumes:
      - .:/monorepo
      - /monorepo/node_modules
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
    networks: [app-net]

  nginx-dev:
    profiles: ["dev"]
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client-dev
      - dashboard-dev
      - server-dev
    ports:
      - "80:80"
    networks: [public-net, app-net]
