networks:
  public-net: {}
  app-net: {}

services:
  # --- prod profile ---
  client:
    profiles: ['prod']
    build:
      context: .
      target: client-production
    environment:
      PORT: 3000
    restart: unless-stopped
    networks: [public-net]

  dashboard:
    profiles: ['prod']
    build:
      context: .
      target: dashboard-production
    environment:
      PORT: 3001
    restart: unless-stopped
    networks: [app-net]

  server:
    profiles: ['prod']
    build:
      context: .
      target: server-production
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_SESSION_API_KEY: ${APPWRITE_SESSION_API_KEY:-}
      APPWRITE_ACCOUNT_CREATION_API_KEY: ${APPWRITE_ACCOUNT_CREATION_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    networks: [app-net]

  nginx-prod:
    profiles: ['prod']
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - dashboard
      - server
    ports:
      - '80:80'
    networks: [public-net, app-net]

  # --- dev profile ---
  client-dev:
    profiles: ['dev']
    build:
      context: .
      target: development
    command: npx turbo run dev --filter=@permello/client
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/monorepo
      - /monorepo/node_modules
    networks: [public-net]

  dashboard-dev:
    profiles: ['dev']
    build:
      context: .
      target: development
    command: npx turbo run dev --filter=@permello/dashboard
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/monorepo
      - /monorepo/node_modules
    networks: [app-net]

  server-dev:
    profiles: ['dev']
    build:
      context: .
      target: server-development
    command: dotnet watch --project MelloClean.Server/MelloClean.Server.csproj run --no-restore
    volumes:
      - ./apps/server:/monorepo/apps/server
      - server-nuget:/root/.nuget/packages
      - server-bin:/monorepo/apps/server/MelloClean.Server/bin
      - server-obj:/monorepo/apps/server/MelloClean.Server/obj
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_SESSION_API_KEY: ${APPWRITE_SESSION_API_KEY:-}
      APPWRITE_ACCOUNT_CREATION_API_KEY: ${APPWRITE_ACCOUNT_CREATION_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ASPNETCORE_ENVIRONMENT: Development
    networks: [app-net]

  nginx-dev:
    profiles: ['dev']
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client-dev
      - dashboard-dev
      - server-dev
    ports:
      - '80:80'
    networks: [public-net, app-net]

volumes:
  server-nuget: {}
  server-bin: {}
  server-obj: {}
